version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: drsync_postgres_dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: drsync_dev
      POSTGRES_USER: drsync_user
      POSTGRES_PASSWORD: drsync_password_dev
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - drsync_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drsync_user -d drsync_dev"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: drsync_redis_dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - drsync_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    command: redis-server --appendonly yes --requirepass drsync_redis_password

  # Backend API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: drsync_backend_dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: drsync_dev
      DB_USER: drsync_user
      DB_PASSWORD: drsync_password_dev
      DATABASE_URL: postgresql://drsync_user:drsync_password_dev@postgres:5432/drsync_dev
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: drsync_redis_password
      REDIS_URL: redis://:drsync_redis_password@redis:6379
      JWT_SECRET: dev_jwt_secret_change_in_production
      PORT: 3001
      # WhatsApp Mock Server (when testing profile is active)
      WHATSAPP_API_URL: http://whatsapp-mock:3099
      WHATSAPP_MOCK_API_URL: http://whatsapp-mock:3099
    ports:
      - "3001:3001"
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - drsync_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: npm run dev

  # WhatsApp Mock Server (for local testing)
  whatsapp-mock:
    build:
      context: ./backend
      dockerfile: Dockerfile.whatsapp-mock
    container_name: drsync_whatsapp_mock
    restart: unless-stopped
    environment:
      NODE_ENV: development
      DOCKER: "true"
      WEBHOOK_URL: http://backend:3001/api/whatsapp/webhook
    ports:
      - "3099:3099"
    volumes:
      - ./backend/src:/app/src
      - /app/node_modules
    networks:
      - drsync_network
    depends_on:
      - backend
    profiles:
      - testing

  # Frontend Next.js Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: drsync_frontend_dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
      BACKEND_URL: http://backend:3001
      NEXT_PUBLIC_API_URL: http://localhost:3001/api
      NEXTAUTH_SECRET: dev_nextauth_secret_change_in_production
      NEXTAUTH_URL: http://localhost:3000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    networks:
      - drsync_network
    depends_on:
      - backend
    command: npm run dev

  # PgAdmin for database management (optional)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: drsync_pgadmin_dev
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@drsync.dev
      PGADMIN_DEFAULT_PASSWORD: pgadmin_password
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    networks:
      - drsync_network
    depends_on:
      - postgres
    profiles:
      - tools

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  drsync_network:
    driver: bridge
