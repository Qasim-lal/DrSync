version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: drsync_postgres
    restart: always
    environment:
      POSTGRES_DB: drsync_prod
      POSTGRES_USER: drsync_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - drsync_network

  redis:
    image: redis:7-alpine
    container_name: drsync_redis
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - drsync_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: drsync_backend
    restart: always
    environment:
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: drsync_prod
      DB_USER: drsync_user
      DB_PASSWORD: ${DB_PASSWORD}
      DATABASE_URL: postgresql://drsync_user:${DB_PASSWORD}@postgres:5432/drsync_prod
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      PORT: 3001
    ports:
      - "3001:3001"
    networks:
      - drsync_network
    depends_on:
      - postgres
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: drsync_frontend
    restart: always
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://${SERVER_IP}:3001/api
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: http://${SERVER_IP}:3000
    ports:
      - "3000:3000"
    networks:
      - drsync_network
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:

networks:
  drsync_network:
    driver: bridge
