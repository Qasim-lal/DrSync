    <script>
        // Function to convert SVG to PNG and download
        function svgToPng(svgElement, filename) {
            const svgData = new XMLSerializer().serializeToString(svgElement);
            const canvas = document.createElement("canvas");
            const ctx = canvas.getContext("2d");
            const img = new Image();
            
            canvas.width = svgElement.width.baseVal.value;
            canvas.height = svgElement.height.baseVal.value;
            
            img.onload = function() {
                ctx.drawImage(img, 0, 0);
                canvas.toBlob(function(blob) {
                    const link = document.createElement('a');
                    link.download = filename;
                    link.href = URL.createObjectURL(blob);
                    link.click();
                });
            };
            
            img.src = "data:image/svg+xml;base64," + btoa(svgData);
        }

        // Add click handlers to download icons
        document.querySelectorAll('svg').forEach((svg, index) => {
            const sizes = ['72x72', '96x96', '128x128', '144x144', '152x152', '192x192', '384x384', '512x512'];
            svg.style.cursor = 'pointer';
            svg.addEventListener('click', () => {
                svgToPng(svg, `icon-${sizes[index]}.png`);
            });
        });
    </script>

    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        div { margin: 20px 0; padding: 10px; border: 1px solid #ddd; }
        svg { border: 1px solid #ccc; margin: 10px; cursor: pointer; }
        svg:hover { opacity: 0.8; }
    </style>

    <p><strong>Instructions:</strong> Click on any SVG icon above to download it as a PNG file.</p>
